<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ClaimGuard — Fraud Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 2rem; }
    .card { background: white; border-radius: 12px; padding: 2rem; width: 100%; max-width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; color: #1a202c; }
    p.sub { color: #718096; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.25rem; }
    input, select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    button { width: 100%; padding: 0.75rem; background: #3182ce; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #2b6cb0; }
    #result { margin-top: 1.25rem; padding: 1rem; border-radius: 8px; text-align: center; display: none; }
    #result.fraud { background: #fff5f5; border: 1px solid #fc8181; color: #c53030; }
    #result.legit { background: #f0fff4; border: 1px solid #68d391; color: #276749; }
    #result .label { font-size: 1.4rem; font-weight: 700; }
    #result .prob { font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
<div class="card">
  <h1>ClaimGuard</h1>
  <p class="sub">Insurance Fraud Detection</p>

  <label>Claim Amount ($)</label>
  <input type="number" id="claim_amount" value="8500" min="0" step="100" />

  <label>Days to Report</label>
  <input type="number" id="days_to_report" value="2" min="0" />

  <label>Prior Claims</label>
  <input type="number" id="num_prior_claims" value="1" min="0" />

  <label>Policy Age (years)</label>
  <input type="number" id="policy_age_years" value="5" min="0" step="0.5" />

  <label>Claim Type</label>
  <select id="claim_type">
    <option value="auto">Auto</option>
    <option value="home">Home</option>
    <option value="health">Health</option>
    <option value="life">Life</option>
  </select>

  <button onclick="predict()">Analyze Claim</button>

  <div id="result">
    <div class="label" id="res-label"></div>
    <div class="prob" id="res-prob"></div>
  </div>
</div>

<script>
async function predict() {
  const payload = {
    claim_amount: +document.getElementById("claim_amount").value,
    days_to_report: +document.getElementById("days_to_report").value,
    num_prior_claims: +document.getElementById("num_prior_claims").value,
    policy_age_years: +document.getElementById("policy_age_years").value,
    claim_type: document.getElementById("claim_type").value,
  };
  const res = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  const el = document.getElementById("result");
  el.className = data.label === "FRAUD" ? "fraud" : "legit";
  el.style.display = "block";
  document.getElementById("res-label").textContent = data.label;
  document.getElementById("res-prob").textContent = `Fraud probability: ${(data.fraud_probability * 100).toFixed(1)}%`;
}
</script>
</body>
</html>
